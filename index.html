<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PST Pizza — Hong Kong</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: #cc5d18;
            display: flex;
            flex-direction: column;
            align-items: center; /* Centers horizontally */
            justify-content: flex-start; /* Anchors to the top so margin-top is absolute */
            overflow-x: hidden;
        }

        .vector-mark {
            /* Height dictates size: 100% of screen minus the 70px total vertical margin */
            height: calc(100vh - 150px);
            height: calc(100dvh - 150px);
            width: auto;
            margin-top: 100px;
            margin-bottom: 50px;
            max-width: 90vw; /* Prevents horizontal overflow if viewed on tall, narrow mobile screens */
            object-fit: contain;
        }
    </style>
</head>
<body>
    <img src="pst-logo.svg" alt="PST Pizza" class="vector-mark">
</body>
</html>
